name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 120s

      - name: Test (race detector)
        run: go test -race ./... -timeout 180s

  fuzz-regression:
    name: Fuzz regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run fuzz targets (short)
        run: |
          go test ./tests/fuzz/ -fuzz=FuzzRefName       -fuzztime=10s
          go test ./tests/fuzz/ -fuzz=FuzzJournalParser -fuzztime=10s
          go test ./tests/fuzz/ -fuzz=FuzzCommitObject  -fuzztime=10s
          go test ./tests/fuzz/ -fuzz=FuzzTreeBlob      -fuzztime=10s
          go test ./tests/fuzz/ -fuzz=FuzzVerifyOnGarbage -fuzztime=10s

  benchmark:
    name: Benchmark tracking
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run benchmarks
        run: |
          go test ./benchmarks/commands/ \
            -bench=BenchmarkInit \
            -bench=BenchmarkCommit \
            -benchtime=3x \
            -benchmem \
            -timeout 300s \
            | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark-results.txt
          retention-days: 90
