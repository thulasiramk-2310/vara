<svg xmlns="http://www.w3.org/2000/svg" viewBox="-131 -136 1242 1242" role="img" aria-label="VARA HUB">
<!-- VARA Fold icon (docs/assets/brand/vara-fold-icon.svg) on a dark tile, so it reads on light and dark browser tabs. -->
