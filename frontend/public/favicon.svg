  </linearGradient>
</defs>
<rect x="-131" y="-136" width="1242" height="1242" rx="273" fill="#0b0c0e"/>
<g>
  <!-- inside left return, the deep red surface recedes into the middle -->
  <path d="M 146 576 Q 141 611 146 650 C 147 672 163 692 194 714 L 414 884 Q 447 912 486 866 L 513 805 Q 446 783 414 713 C 376 651 365 579 382 494 L 416 381 L 246 514 Z" fill="url(#redLeft)"/>
