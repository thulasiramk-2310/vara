    <stop offset="0" stop-color="#FFFDF7"/><stop offset=".37" stop-color="#F0E8DE"/>
    <stop offset=".78" stop-color="#D8C9BD"/><stop offset="1" stop-color="#9C8B82"/>
  </linearGradient>
