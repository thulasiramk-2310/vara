<svg width="700" height="308" viewBox="0 0 700 308"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="VARA version control engine — terminal demo">
  <title>VARA terminal demo</title>
  <desc>Animated terminal showing vara init, add, commit, history, and verify commands</desc>
  <defs>
    <style>
      .win { font-family: "JetBrains Mono","Cascadia Code","Fira Code",Menlo,Consolas,monospace; font-size: 13px; }
      .dim { fill: #6e7681; }
      .wht { fill: #e6edf3; }
      .grn { fill: #3fb950; }
      .blu { fill: #58a6ff; }
      .ylw { fill: #e3b341; }
      .ttl { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 12px; }
      @keyframes in   { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blnk { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .s0  { opacity: 0; animation: in .2s  0.5s both; }
      .s1  { opacity: 0; animation: in .2s  1.2s both; }
      .s2  { opacity: 0; animation: in .2s  2.1s both; }
      .s3  { opacity: 0; animation: in .2s  2.7s both; }
      .s4  { opacity: 0; animation: in .2s  3.4s both; }
      .s5  { opacity: 0; animation: in .2s  4.3s both; }
      .s6  { opacity: 0; animation: in .2s  5.0s both; }
      .s7  { opacity: 0; animation: in .2s  5.3s both; }
      .s8  { opacity: 0; animation: in .2s  6.1s both; }
      .s9  { opacity: 0; animation: in .2s  6.8s both; }
      .cur { opacity: 0; animation: blnk  1s  7.4s infinite; }
    </style>
  </defs>

  <!-- Window background -->
  <rect width="700" height="308" rx="10" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="700" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="700" height="10" fill="#161b22"/>
  <line x1="0" y1="36" x2="700" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>

  <!-- Window title -->
  <text x="350" y="23" text-anchor="middle" class="ttl">vara — ~/myproject</text>

  <!-- s0: vara init -->
  <text x="20" y="62" class="win s0">
    <tspan class="grn">$</tspan><tspan class="wht"> vara init</tspan>
  </text>

  <!-- s1: init output -->
  <text x="20" y="80" class="win s1">
    <tspan class="dim">Initialized empty VARA repository in</tspan><tspan class="grn"> .vara</tspan>
  </text>

  <!-- s2: vara add -->
  <text x="20" y="110" class="win s2">
    <tspan class="grn">$</tspan><tspan class="wht"> vara add .</tspan>
  </text>

  <!-- s3: vara commit -->
  <text x="20" y="128" class="win s3">
    <tspan class="grn">$</tspan><tspan class="wht"> vara commit -m </tspan><tspan class="ylw">"initial project structure"</tspan>
  </text>

  <!-- s4: commit output -->
  <text x="20" y="146" class="win s4">
    <tspan class="dim">[</tspan><tspan class="blu">4f2a9c1</tspan><tspan class="dim">] initial project structure</tspan>
  </text>

  <!-- s5: vara history -->
  <text x="20" y="176" class="win s5">
    <tspan class="grn">$</tspan><tspan class="wht"> vara history</tspan>
  </text>

  <!-- s6: commit hash line -->
  <text x="20" y="194" class="win s6">
    <tspan class="dim">commit </tspan><tspan class="blu">4f2a9c1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e</tspan>
  </text>

  <!-- s7: commit message -->
  <text x="20" y="212" class="win s7">
    <tspan class="dim">    initial project structure</tspan>
  </text>

  <!-- s8: vara verify -->
  <text x="20" y="242" class="win s8">
    <tspan class="grn">$</tspan><tspan class="wht"> vara verify</tspan>
  </text>

  <!-- s9: verify result -->
  <text x="20" y="260" class="win s9">
    <tspan class="dim">Objects </tspan><tspan class="grn">✔ 3</tspan><tspan class="dim">   Commits </tspan><tspan class="grn">✔ 1</tspan><tspan class="dim">   Index </tspan><tspan class="grn">✔ 1</tspan><tspan class="dim">   Result </tspan><tspan class="grn">Repository Healthy</tspan>
  </text>

  <!-- cursor -->
  <text x="20" y="290" class="win cur">
    <tspan class="grn">$</tspan><tspan class="wht"> ▋</tspan>
  </text>
</svg>
